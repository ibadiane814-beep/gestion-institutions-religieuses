

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gir_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - gir_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: gir_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gir_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: gir_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestion_institutions
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3307"
    volumes:
      - gir_db_data:/var/lib/mysql
    networks:
      - gir_network

networks:
  gir_network:
    driver: bridge

volumes:
  gir_db_data:
    driver: local
